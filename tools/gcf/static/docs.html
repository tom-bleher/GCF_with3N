<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GCF_with3N documentation</title>
<style>
:root { color-scheme: light dark; --bg: #f4f5f8; --card: #fff; --text: #1d2330; --muted: #5d6677; --line: #b8bfca; --accent: #2f6fd1; --code-bg: #f0f2f5; }
@media (prefers-color-scheme: dark) { :root { color-scheme: dark; --bg: #14171c; --card: #1c2027; --text: #e3e6eb; --muted: #9aa3b2; --line: #4a5262; --accent: #5b93ec; --code-bg: #232831; } }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 900px; margin: 0 auto; padding: 24px 24px 60px; background: var(--card); min-height: 100vh; box-sizing: border-box; }
a { color: var(--accent); }
h1, h2, h3 { line-height: 1.25; margin: 1.4em 0 .5em; } h1 { margin-top: .2em; font-size: 26px; } h2 { font-size: 20px; border-bottom: 1px solid var(--line); padding-bottom: 4px; } h3 { font-size: 16px; }
h2 a.anchor, h3 a.anchor { color: var(--muted); text-decoration: none; margin-left: 6px; opacity: 0; } h2:hover a.anchor, h3:hover a.anchor { opacity: 1; }
code { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--code-bg); padding: 1px 4px; border-radius: 3px; }
pre { background: var(--code-bg); padding: 12px; border-radius: 6px; overflow: auto; } pre code { background: none; padding: 0; }
table { border-collapse: collapse; margin: 12px 0; width: 100%; } th, td { border: 1px solid var(--line); padding: 5px 8px; text-align: left; vertical-align: top; } th { background: var(--code-bg); }
blockquote { margin: 12px 0; padding: 4px 14px; border-left: 3px solid var(--line); color: var(--muted); }
hr { border: 0; border-top: 1px solid var(--line); margin: 24px 0; }
.back { font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <p class="back"><a id="back" href="#">← Back to GCF_with3N</a></p>
  <div id="doc"><p>Loading…</p></div>
</main>
<script>
"use strict";
// A small Markdown renderer for docs/PIPELINE.md: headings, paragraphs, lists,
// tables, fenced code, blockquotes, rules, and inline code/bold/italic/links.
const TOKEN = new URLSearchParams(location.search).get("token") || "";
document.getElementById("back").href = "/?token=" + encodeURIComponent(TOKEN);
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const slug = s => s.toLowerCase().replace(/<[^>]*>/g, "").replace(/[^\w\s-]/g, "").trim().replace(/\s+/g, "-");
function inline(s) {
  const codes = [];
  s = esc(s).replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return `\u0000${codes.length - 1}\u0000`; });
  s = s.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, "$1<i>$2</i>")
       .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, u) => `<a href="${u.startsWith("#") || /^https?:/.test(u) ? u : "#"}">${t}</a>`);
  return s.replace(/\u0000(\d+)\u0000/g, (m, i) => `<code>${codes[i]}</code>`);
}
function render(md) {
  const lines = md.split("\n"), out = []; let i = 0;
  const para = []; const flush = () => { if (para.length) { out.push(`<p>${inline(para.join(" "))}</p>`); para.length = 0; } };
  while (i < lines.length) {
    const l = lines[i];
    if (/^```/.test(l)) { flush(); const buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]); i++; out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`); continue; }
    const h = /^(#{1,6})\s+(.*)$/.exec(l);
    if (h) { flush(); const n = h[1].length, t = inline(h[2]), id = slug(h[2]); out.push(`<h${n} id="${id}">${t}${n > 1 ? ` <a class="anchor" href="#${id}">#</a>` : ""}</h${n}>`); i++; continue; }
    if (/^\s*---+\s*$/.test(l)) { flush(); out.push("<hr>"); i++; continue; }
    if (/^\|/.test(l) && /^\|?\s*:?-+/.test(lines[i + 1] || "")) {
      flush(); const cells = r => r.replace(/^\||\|$/g, "").split("|").map(c => inline(c.trim()));
      let html = "<table><thead><tr>" + cells(l).map(c => `<th>${c}</th>`).join("") + "</tr></thead><tbody>"; i += 2;
      while (i < lines.length && /^\|/.test(lines[i])) { html += "<tr>" + cells(lines[i]).map(c => `<td>${c}</td>`).join("") + "</tr>"; i++; }
      out.push(html + "</tbody></table>"); continue;
    }
    const li = /^(\s*)([-*]|\d+\.)\s+(.*)$/.exec(l);
    if (li) {
      flush(); const ordered = /\d/.test(li[2]); const items = [];
      while (i < lines.length) {
        const m = /^(\s*)([-*]|\d+\.)\s+(.*)$/.exec(lines[i]);
        if (m) { items.push(m[3]); i++; }
        else if (/^\s{2,}\S/.test(lines[i]) && items.length) { items[items.length - 1] += " " + lines[i].trim(); i++; }
        else break;
      }
      out.push(`<${ordered ? "ol" : "ul"}>` + items.map(t => `<li>${inline(t)}</li>`).join("") + `</${ordered ? "ol" : "ul"}>`); continue;
    }
    if (/^>\s?/.test(l)) { flush(); const buf = []; while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, "")); out.push(`<blockquote>${inline(buf.join(" "))}</blockquote>`); continue; }
    if (!l.trim()) { flush(); i++; continue; }
    para.push(l.trim()); i++;
  }
  flush(); return out.join("\n");
}
fetch("api/docs", { headers: { "X-GCF-Token": TOKEN } }).then(r => r.ok ? r.text() : Promise.reject(new Error(r.statusText)))
  .then(md => { document.getElementById("doc").innerHTML = render(md); if (location.hash) { const t = document.querySelector(location.hash); if (t) t.scrollIntoView(); } })
  .catch(e => { document.getElementById("doc").textContent = "Could not load the documentation: " + e.message; });
</script>
</body>
</html>
